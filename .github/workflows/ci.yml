name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  spring:
    name: Spring Boot (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Spotless check
        run: ./mvnw --batch-mode spotless:check

      - name: Test
        run: ./mvnw --batch-mode test

      - name: Package
        run: ./mvnw --batch-mode package -DskipTests

  agent:
    name: Agent Python (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Pytest
        run: pytest

  e2e:
    name: E2E (docker compose smoke test)
    runs-on: ubuntu-latest
    needs: [spring, agent]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up --build --wait

      - name: Smoke test
        run: python3 scripts/smoke_test.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
