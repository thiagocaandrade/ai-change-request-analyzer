name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  spring:
    name: Spring Boot (compile, unit, integration, quality, docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: |
          set -o pipefail
          ./mvnw --batch-mode compile 2>&1 | tee build.log

      - name: Unit tests (surefire)
        run: ./mvnw --batch-mode test

      - name: Integration tests (mvn verify with Failsafe)
        run: |
          set -o pipefail
          ./mvnw --batch-mode verify 2>&1 | tee test.log

      - name: Quality checks (spotless)
        run: ./mvnw --batch-mode spotless:check

      - name: Docker image
        run: docker build -t analyzer:ci .

      - name: Redact sensitive patterns from logs
        if: always()
        run: python3 scripts/redact_logs.py build.log test.log

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            build.log
            test.log
          if-no-files-found: warn

  agent:
    name: Agent Python (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Pytest
        run: pytest

  e2e:
    name: E2E (docker compose smoke test)
    runs-on: ubuntu-latest
    needs: [spring, agent]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up --build --wait

      - name: Smoke test
        run: python3 scripts/smoke_test.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
